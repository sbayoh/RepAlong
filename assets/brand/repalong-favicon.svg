<!--
  RepAlong "simple monogram" — the one approved circular-badge treatment, reserved for
  tiny-scale contexts (browser favicon) where the flat mark alone loses contrast against
  arbitrary surrounding chrome. Not used for the primary in-app mark (RepAlongMark never
  renders a circle) — see docs/brand-system.md §7 for the distinction.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
